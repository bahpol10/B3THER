name: Bootstrap source tree 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unzip source archive
        run: |
          unzip -o b3ther-src.zip
          rm -f b3ther-src.zip .muse-write-test.txt .muse-push-test.txt
          rm -f .github/workflows/build.yml
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B3THER: import full source tree (app + vendored Aether core 2.4.0 + quiche)"
          git push
